<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- `interactive-widget=resizes-content`: sin esto el teclado se superpone a la
         página sin encogerla, y todo lo anclado abajo (los paneles de formulario)
         queda detrás del teclado. Con esto el viewport encoge de verdad. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0a0a0c" />
    <script>
      // Aplica el tema guardado antes de que la página pinte nada: si esto
      // esperara al primer efecto de React, alguien con "Claro" elegido vería
      // un parpadeo oscuro en cada carga, antes de que React alcance a
      // corregirlo. La clave tiene que ser la misma que usa useTheme.ts — acá
      // no se puede importar ese módulo, así que queda repetida a mano.
      try {
        var theme = localStorage.getItem('kurosei:theme')
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap"
    />
    <title>Kurosei</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
